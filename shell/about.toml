# cargo-about configuration for the Tauri shell (T-P6-02, migration plan §9.5).
#
# Machine-readable inventory consumed by scripts/collect_release_licenses.py:
#   cargo about generate --frozen --manifest-path shell/app/Cargo.toml \
#       --format json -o <out>/cargo-about.json
# Human-readable listing (optional, same data):
#   cargo about generate --frozen --manifest-path shell/app/Cargo.toml \
#       -o <out>/rust-licenses.md shell/about.hbs
#
# cargo-about finds this file by walking up from shell/app/Cargo.toml.
# --frozen = --locked --offline: Cargo.lock is authoritative and nothing is
# fetched; crates that ship no license file fall back to the canonical text.

# Same target as shell/deny.toml [graph].targets.
targets = ["x86_64-pc-windows-msvc"]
# Build dependencies (tauri-build, proc macros, ...) are listed too: they are
# not linked at runtime, but over-attribution is harmless and keeps the list
# identical to what cargo-deny checks.
ignore-build-dependencies = false
ignore-dev-dependencies = true
# tesseract-shell (publish = false) is Tesseract itself (LICENSE).
private = { ignore = true }

# Priority order for "A OR B" choices; the same five licenses as the
# shell/deny.toml allow list. MIT first keeps the notices short.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# Clarifications (T-P6-02 close-out, 2026-10-26). cargo-about only scans files
# whose names match the `ignore` crate's license globs, so the license files
# below (LICENSE_MIT, license-mit, LICENSE-LIBM-MIT) were never read and the
# crates fell back to the canonical text without their copyright line. Each
# entry pins the crate's own file by SHA-256 (cargo-about applies it to every
# version of that crate name). A checksum that stops matching only makes
# cargo-about warn "failed to validate all files specified in clarification";
# the release gate treats that warning as a failure.
# Expressions are the crates' own Cargo.toml `license` values.

# tauri 2.11.5 family: LICENSE_MIT / LICENSE_APACHE-2.0.

[tauri.clarify]
license = "Apache-2.0 OR MIT"

[[tauri.clarify.files]]
path = "LICENSE_MIT"
license = "MIT"
checksum = "9dd42ea92cff2ede5cd477cbfcce051b2d0115c0ac7f368ee88cb545055dff1d"

