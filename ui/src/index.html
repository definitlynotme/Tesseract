<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tesseract</title>
<!-- @build:css -->
</head>
<body>
<div class="app" id="app" data-run="unknown" data-ks="unknown">
  <aside class="side" data-i18n-attr="aria-label:shell.side.aria">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M42.5 90V47A17 17 0 0 0 25.5 30H6M57.5 90V47A17 17 0 0 1 74.5 30H94"/><circle class="brand-dot" cx="80" cy="11" r="5.8"/></svg>
      <button class="brand-name" id="letter-open" type="button" title="" data-tip-pos="bottom"><span class="wordmark">Tesseract</span><svg class="brand-mail" viewBox="0 0 16 12" aria-hidden="true" hidden><rect x="1" y="1" width="14" height="10" rx="2.4"/><path d="M2.2 2.4L8 6.9L13.8 2.4"/></svg></button>
    </div>

    <nav class="nav" id="nav" data-i18n-attr="aria-label:shell.nav.aria">
      <span class="nav-ind" aria-hidden="true"></span><span class="nav-hov" aria-hidden="true"></span>
      <button class="nav-item" type="button" data-nav="overview"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.95" aria-hidden="true"><rect x="4.8" y="4.8" width="6" height="6" rx="1.8"/><rect x="13.2" y="4.8" width="6" height="6" rx="1.8"/><rect x="4.8" y="13.2" width="6" height="6" rx="1.8"/><circle class="d" cx="16.2" cy="16.2" r="2.1"/></svg><span data-i18n="shell.nav.overview"></span><span class="nav-key" aria-hidden="true" translate="no"><kbd>Ctrl</kbd><kbd>1</kbd></span></button>
      <button class="nav-item" type="button" data-nav="profiles"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.95" aria-hidden="true"><path d="M12 4.4L19.2 8.2L12 12L4.8 8.2Z"/><path d="M4.8 12.2L12 16L19.2 12.2"/><circle class="d" cx="12" cy="19.7" r="1.4"/></svg><span data-i18n="shell.nav.profiles"></span><span class="nav-key" aria-hidden="true" translate="no"><kbd>Ctrl</kbd><kbd>2</kbd></span></button>
      <button class="nav-item" type="button" data-nav="logs"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.95" aria-hidden="true"><circle class="d" cx="5.6" cy="7" r="1.45"/><path d="M9.4 7H18.6"/><path d="M5.4 12H18.6"/><path d="M5.4 17H14.2"/></svg><span data-i18n="shell.nav.logs"></span><span class="nav-key" aria-hidden="true" translate="no"><kbd>Ctrl</kbd><kbd>3</kbd></span></button>
      <button class="nav-item" type="button" data-nav="settings"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.95" aria-hidden="true"><path d="M4.8 8H8.1"/><path d="M12.9 8H19.2"/><circle cx="10.5" cy="8" r="2.35"/><path d="M4.8 16H11.1"/><path d="M15.9 16H19.2"/><circle class="d" cx="13.5" cy="16" r="2.35"/></svg><span data-i18n="shell.nav.settings"></span><span class="nav-key" aria-hidden="true" translate="no"><kbd>Ctrl</kbd><kbd>4</kbd></span></button>
    </nav>

    <footer class="side-foot"></footer>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb" aria-live="polite"></div>
      <div class="toast-slot" id="toast-slot" aria-live="polite"></div>
      <button class="notice-pill" id="notice-pill" type="button" aria-controls="notices" aria-expanded="false" data-tip-pos="bottom" hidden></button>
      <button class="cmd-btn" id="cmd-open" type="button" data-i18n-attr="aria-label:shell.topbar.cmd.aria">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" stroke-width="2.1" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.6"/><path d="M15 15L19.2 19.2"/></svg><span data-i18n="shell.topbar.cmd.label"></span><span class="keys" translate="no"><kbd>Ctrl</kbd><kbd>K</kbd></span>
      </button>
    </header>
    <div class="notices" id="notices">
      <div class="banners" id="banners" aria-live="assertive"></div>
      <div class="ntc-dots" id="notice-dots" hidden></div>
    </div>
    <div class="host" id="host">
      <div class="pages" id="pages"></div>
    </div>
  </main>
</div>
<div id="layer"></div>
<div class="wc" id="wc" data-max="false">
  <button class="wc-b" type="button" tabindex="-1" data-wc="minimize" data-tip-pos="bottom" data-i18n-attr="aria-label:shell.window.minimize;data-tip:shell.window.minimize"><span class="wc-in"><svg class="ic" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.75 6H10.25"/></svg></span></button>
  <button class="wc-b" type="button" tabindex="-1" data-wc="toggle_maximize" data-tip-pos="bottom" data-i18n-attr="aria-label:shell.window.maximize;data-tip:shell.window.maximize"><span class="wc-in"><svg class="ic wc-max" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.75" y="1.75" width="8.5" height="8.5" rx="2"/></svg><svg class="ic wc-res" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.75" y="3.75" width="6.5" height="6.5" rx="1.6"/><path d="M4 3.75V3.5A1.75 1.75 0 0 1 5.75 1.75H8.5A1.75 1.75 0 0 1 10.25 3.5V6.25A1.75 1.75 0 0 1 8.5 8H8.25"/></svg></span></button>
  <button class="wc-b wc-close" type="button" tabindex="-1" data-wc="close" data-tip-pos="bottom" data-i18n-attr="aria-label:shell.window.close;data-tip:shell.window.close"><span class="wc-in"><svg class="ic" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.25 2.25L9.75 9.75M9.75 2.25L2.25 9.75"/></svg></span></button>
</div>

<!-- @build:js -->
</body>
</html>
